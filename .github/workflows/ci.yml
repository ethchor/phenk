name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phenk
          POSTGRES_PASSWORD: phenk
          POSTGRES_DB: phenk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The storage tests refuse to skip in CI: a missing database must be a
      # failure here, not a silent gap in coverage.
      PHENK_TEST_DSN: postgres://phenk:phenk@127.0.0.1:5432/phenk_test?sslmode=disable
      PHENK_TEST_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v4

      # Read the version out of go.mod so the toolchain CI uses can never
      # drift from the one the module declares.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify the API client types are current
        run: |
          npm run api
          if ! git diff --quiet -- packages/ui/src/api/schema.d.ts; then
            echo "The generated API client is stale. Run 'npm run api' and commit the result."
            git --no-pager diff -- packages/ui/src/api/schema.d.ts
            exit 1
          fi

      - name: Typecheck the frontend
        run: npm run typecheck

      # The inbox app is embedded into the binary, so it is built before the Go
      # build and tests rather than alongside them. Building it here is also
      # what guarantees the embedded assets can never be stale.
      - name: Build the inbox app
        run: npm run build --workspace web

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l . | grep -v '^internal/web/dist/' || true)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify module tidiness
        run: |
          cp go.mod go.mod.orig
          cp go.sum go.sum.orig
          go mod tidy
          diff -u go.mod.orig go.mod
          diff -u go.sum.orig go.sum
          rm go.mod.orig go.sum.orig

      - name: Verify generated code is current
        run: |
          go generate ./...
          if ! git diff --quiet -- internal/api/apigen; then
            echo "Generated code is stale. Run 'make generate' and commit the result."
            git --no-pager diff -- internal/api/apigen
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
