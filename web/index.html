<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- This surface has one route, cookie auth, and nothing worth indexing.
         Keeping it out of search results also keeps live inboxes out of them. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Phenk</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      try {
        const stored = localStorage.getItem("phenk-theme");
        const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
